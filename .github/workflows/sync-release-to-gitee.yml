name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python dependencies
        run: python -m pip install requests requests-toolbelt

      - name: Sync GitHub Release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ZHL13
          GITEE_REPO: markdnext
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import time
          import urllib.parse
          from pathlib import Path

          import requests
          from requests_toolbelt.multipart.encoder import MultipartEncoder

          gitee_token = os.environ["GITEE_TOKEN"]
          gitee_owner = os.environ["GITEE_OWNER"]
          gitee_repo = os.environ["GITEE_REPO"]
          github_token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          release = event.get("release")
          if not release:
              requested_tag = (event.get("inputs") or {}).get("tag", "").strip()
              endpoint = (
                  f"https://api.github.com/repos/{repository}/releases/tags/{urllib.parse.quote(requested_tag, safe='')}"
                  if requested_tag else f"https://api.github.com/repos/{repository}/releases/latest"
              )
              response = requests.get(
                  endpoint,
                  headers={"Authorization": f"Bearer {github_token}",
                           "Accept": "application/vnd.github+json"},
                  timeout=(30, 60),
              )
              response.raise_for_status()
              release = response.json()

          tag = release["tag_name"]
          name = release.get("name") or tag
          body = release.get("body") or ""
          target = release.get("target_commitish") or "main"
          prerelease = "true" if release.get("prerelease") else "false"
          base = f"https://gitee.com/api/v5/repos/{gitee_owner}/{gitee_repo}"
          print(f"Syncing GitHub release {tag}", flush=True)

          def gitee_get_release_by_tag():
              encoded_tag = urllib.parse.quote(tag, safe="")
              r = requests.get(f"{base}/releases/tags/{encoded_tag}",
                               params={"access_token": gitee_token}, timeout=(30, 60))
              if r.status_code == 200:
                  return r.json()
              if r.status_code == 404:
                  return None
              raise RuntimeError(f"Failed to query Gitee release: {r.status_code} {r.text}")

          def gitee_create_release():
              r = requests.post(f"{base}/releases", data={
                  "access_token": gitee_token, "tag_name": tag, "name": name,
                  "body": body, "target_commitish": target, "prerelease": prerelease,
              }, timeout=(30, 60))
              if r.status_code not in (200, 201):
                  raise RuntimeError(f"Failed to create Gitee release: {r.status_code} {r.text}")
              return r.json()

          def gitee_update_release(release_id):
              r = requests.patch(f"{base}/releases/{release_id}", data={
                  "access_token": gitee_token, "tag_name": tag, "name": name,
                  "body": body, "target_commitish": target, "prerelease": prerelease,
              }, timeout=(30, 60))
              if r.status_code not in (200, 201):
                  raise RuntimeError(f"Failed to update Gitee release: {r.status_code} {r.text}")
              return r.json()

          def gitee_list_assets(release_id):
              r = requests.get(f"{base}/releases/{release_id}/attach_files",
                               params={"access_token": gitee_token}, timeout=(30, 60))
              if r.status_code != 200:
                  raise RuntimeError(f"Failed to list Gitee release assets: {r.status_code} {r.text}")
              names = set()
              for item in r.json():
                  for key in ("name", "filename", "file_name"):
                      if item.get(key):
                          names.add(item[key])
              return names

          def download_github_asset(asset, output_path):
              headers = {
                  "Authorization": f"Bearer {github_token}",
                  "Accept": "application/octet-stream",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              with requests.get(asset["url"], headers=headers, stream=True,
                                timeout=(30, 120)) as response:
                  response.raise_for_status()
                  with open(output_path, "wb") as output:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              output.write(chunk)

          def upload_gitee_asset(release_id, file_path):
              with open(file_path, "rb") as f:
                  encoder = MultipartEncoder(fields={
                      "access_token": gitee_token,
                      "file": (file_path.name, f, "application/octet-stream"),
                  })
                  r = requests.post(
                      f"{base}/releases/{release_id}/attach_files",
                      data=encoder,
                      headers={"Content-Type": encoder.content_type},
                      timeout=(30, 600),
                  )
              if r.status_code not in (200, 201):
                  raise RuntimeError(f"Failed to upload {file_path.name}: {r.status_code} {r.text}")

          def upload_with_retries(release_id, file_path, max_attempts=4):
              for attempt in range(1, max_attempts + 1):
                  if file_path.name in gitee_list_assets(release_id):
                      print(f"Already uploaded: {file_path.name}", flush=True)
                      return
                  try:
                      print(f"Uploading {file_path.name}, attempt {attempt}/{max_attempts}", flush=True)
                      upload_gitee_asset(release_id, file_path)
                      return
                  except (requests.RequestException, RuntimeError) as exc:
                      print(f"Upload attempt {attempt} failed: {exc}", flush=True)
                      if attempt == max_attempts:
                          raise
                      time.sleep(min(30 * attempt, 90))

          gitee_release = None
          last_error = None
          for attempt in range(10):
              try:
                  gitee_release = gitee_get_release_by_tag()
                  if gitee_release:
                      gitee_release = gitee_update_release(gitee_release["id"])
                  else:
                      gitee_release = gitee_create_release()
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Release attempt {attempt + 1}/10 failed: {exc}", flush=True)
                  if attempt < 9:
                      time.sleep(30)

          if not gitee_release:
              raise RuntimeError(f"Could not create/update Gitee release: {last_error}")

          release_id = gitee_release["id"]
          existing_assets = gitee_list_assets(release_id)
          assets = release.get("assets", [])
          print(f"GitHub release assets: {len(assets)}", flush=True)
          for asset in assets:
              filename = asset["name"]
              if filename in existing_assets:
                  print(f"Skip existing asset: {filename}", flush=True)
                  continue
              path = Path(filename)
              print(f"Downloading GitHub asset: {filename}", flush=True)
              download_github_asset(asset, path)
              try:
                  upload_with_retries(release_id, path)
              finally:
                  path.unlink(missing_ok=True)
          print(f"Done: synced release {tag} to Gitee.", flush=True)
          PY
